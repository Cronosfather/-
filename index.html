<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>이름 랜덤 생성기</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #020617);
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 420px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 30px;
      letter-spacing: -1px;
    }

    .result {
      font-size: 56px;
      font-weight: 800;
      margin: 28px 0;
      color: #38bdf8;
      min-height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      border: none;
      padding: 14px 28px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 14px;
      background: #38bdf8;
      color: #020617;
      cursor: pointer;
      transition: 0.18s ease;
    }

    button:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
    }

    .history-box {
      margin-top: 28px;
      padding: 16px;
      background: rgba(2, 6, 23, 0.75);
      border-radius: 14px;
      text-align: center;
      max-height: 170px;
      overflow-y: auto;
    }

    .history-title {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .name-item {
      padding: 6px 0;
      font-size: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .name-item:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>이름 랜덤 생성기</h1>

    <div class="result" id="result">황준우</div>

    <button onclick="generateName()">랜덤 생성</button>

    <div class="history-box">
      <div class="history-title">생성 기록</div>
      <div id="history"></div>
    </div>
  </div>

  <script>
    const firstSyllables = ["황", "횡"];
    const secondSyllables = ["준", "진", "잔", "쥰"];
    const lastSyllable = "우";

    function randomPick(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function generateName() {
      const first = randomPick(firstSyllables);
      const second = randomPick(secondSyllables);
      const newName = first + second + lastSyllable;

      document.getElementById("result").textContent = newName;

      const history = document.getElementById("history");
      const item = document.createElement("div");
      item.className = "name-item";
      item.textContent = newName;
      history.prepend(item);
    }
  </script>
</body>
</html>
